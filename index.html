  window.addEventListener("keydown", function (e) {
    if (e.target && e.target.tagName === "INPUT") return;
    var k = e.code;
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(k) !== -1) e.preventDefault();
    keys[k] = true;
    audio();
    if (k === "KeyM") muted = !muted;
    if (picking && state === "play" && pause === 0) { if (k === "Digit1" || k === "Numpad1") choose(0); else if (k === "Digit2" || k === "Numpad2") choose(1); else if (k === "Digit3" || k === "Numpad3") choose(2); }
    if ((k === "KeyP" || k === "Escape") && state === "play") { if (pause === 0) doPause(); else if (pause === 1) { pause = 2; countT = 3; } }
    if (state === "start" && (k === "ArrowLeft" || k === "ArrowRight")) { var nk = skin; do { nk = (nk + (k === "ArrowRight" ? 1 : SK.length - 1)) % SK.length; } while (!owned(nk)); pickSkin(nk); }

      if (state === "start") { level = 1; start(); }

    } else if (k === "Escape" && (state === "win" || state === "over") && performance.now() >= endAt) lobby();
  });

        pointer.down = false; return;
      }

        g.lineJoin = "round"; g.lineWidth = fsz * 0.16; g.strokeStyle = "#04200f"; g.strokeText("SPACE TRAPP", 0, 0);
        g.shadowColor = "rgba(60,255,120,0.9)"; g.shadowBlur = 26;
        var gg = g.createLinearGradient(0, -fsz * 0.8, 0, fsz * 0.1); gg.addColorStop(0, "#b6ff5c"); gg.addColorStop(0.55, "#2ee66b"); gg.addColorStop(1, "#0fa84a");
        g.fillStyle = gg; g.fillText("SPACE TRAPP", 0, 0);
        g.shadowBlur = 0; g.lineWidth = 2; g.strokeStyle = "rgba(255,255,255,0.5)"; g.strokeText("SPACE TRAPP", -1, -2);
        g.fillStyle = "#1fd35c";
        [-0.38, -0.12, 0.2, 0.41].forEach(function (fr, i) {
          var dx = fr * tw * fsz / 100, dl = fsz * (0.25 + (i % 3) * 0.12);
          g.fillRect(dx - 2.5, 4, 5, dl); g.beginPath(); g.arc(dx, 4 + dl, 4, 0, 7); g.fill();
        });
        g.restore();
        text("👤 " + nick, 16, 30, 15, "#e8ecf4", "left", 700); ubtn(W - 56, 28, 84, 34, "Sair", "logout", false);
        ubtn(cx - 75, H * 0.5, 140, 42, "💻 PC", "pc", mode === "pc");
        ubtn(cx + 75, H * 0.5, 140, 42, "📱 Celular", "mobile", mode === "mobile");
        ubtn(cx, H * 0.61, 220, 56, "JOGAR", "play", false, true);
        ubtn(cx, H * 0.72, 180, 46, "🚀 Naves", "ships", false);
        ubtn(cx, H * 0.81, 180, 46, "🛒 Loja", "shop", false);
        g.font = "700 20px " + FONT; var bw2 = g.measureText(String(bag)).width + 28, bx2 = cx - bw2 / 2;
        coin(bx2 + 10, H * 0.91, 10); text(String(bag), bx2 + 28, H * 0.91 + 7, 20, "#ffd166", "left", 700);
      } else if (tab === "ships") {
        g.fillStyle = "rgba(7,11,22,0.7)"; g.fillRect(0, 0, W, H);
        text("NAVES", cx, H * 0.12, 28, "#ffd166", "center", 800);
        if (own1) {
          var py = H * 0.3 + 270, pw3 = Math.min(W - 30, 330), dd = GH(), gc = [5000, 7000][glv - 1];
          g.fillStyle = "rgba(255,255,255,0.06)"; g.fillRect(cx - pw3 / 2, py - 45, pw3, 90); g.strokeStyle = "#1fd3a3"; g.lineWidth = 2; g.strokeRect(cx - pw3 / 2, py - 45, pw3, 90);
          text("Fantasma · Nível " + glv + "/3", cx, py - 24, 15, "#1fd3a3", "center", 700);
          text("Intangível " + dd[0] + "s a cada " + dd[1] + "s · Tiro 5", cx, py - 6, 12, "#e8ecf4", "center", 500);
          if (glv < 3) ubtn(cx, py + 24, 240, 30, "⬆ Nível " + (glv + 1) + " · " + gc, "gup", false); else text("Nível máximo", cx, py + 28, 13, "#ffd166", "center", 700);
        }
        SK.forEach(function (sk, i) {
          var bx = cx + (i % 3 - 1) * 112, by = H * 0.3 + Math.floor(i / 3) * 150;
          uiBtns.push({ x: bx, y: by, w: 104, h: 130, a: "skin" + i });
          g.fillStyle = "rgba(255,255,255,0.06)"; g.fillRect(bx - 52, by - 65, 104, 130);
          g.strokeStyle = i === skin ? "#ffd166" : "rgba(255,255,255,0.25)"; g.lineWidth = 2; g.strokeRect(bx - 52, by - 65, 104, 130);
          drawShip(bx, by - 8, 1, 1, false, sk);
          if (!owned(i)) { g.fillStyle = "rgba(7,11,22,0.6)"; g.fillRect(bx - 51, by - 64, 102, 128); text(i === 1 ? "🔒 Loja" : "Indisponível", bx, by + 30, 12, i === 1 ? "#ffd166" : "#8d97ab", "center", 600); }
          text(sk.n, bx, by + 50, 14, i === skin ? "#ffd166" : "#e8ecf4", "center", 600);
        });
        ubtn(cx, H - 50, 160, 44, "← Voltar", "back", false);
      } else if (tab === "shop") {
        g.fillStyle = "rgba(7,11,22,0.7)"; g.fillRect(0, 0, W, H);
        text("LOJA", cx, H * 0.1, 28, "#ffd166", "center", 800);
        g.font = "700 18px " + FONT; var sw = g.measureText(String(bag)).width + 26;
        coin(cx - sw / 2 + 9, H * 0.1 + 28, 9); text(String(bag), cx - sw / 2 + 26, H * 0.1 + 34, 18, "#ffd166", "left", 700);
        text("NAVES", 20, H * 0.24, 14, "#8d97ab", "left", 700);
        var cw2 = Math.min(W - 30, 340), sy = H * 0.24 + 66, lx2 = cx - cw2 / 2;
        g.fillStyle = "rgba(255,255,255,0.06)"; g.fillRect(lx2, sy - 55, cw2, 110); g.strokeStyle = "#1fd3a3"; g.lineWidth = 2; g.strokeRect(lx2, sy - 55, cw2, 110);
        drawShip(lx2 + 45, sy - 10, 1, 1, false, SK[1]);
        text("Fantasma", lx2 + 90, sy - 32, 16, "#1fd3a3", "left", 700);
        text("Intangível 5s a cada 25s", lx2 + 90, sy - 12, 12, "#e8ecf4", "left", 500);
        text("Tiro com 5 de dano · 3 níveis", lx2 + 90, sy + 6, 12, "#e8ecf4", "left", 500);
        if (own1) text("✔ Comprada", cx, sy + 42, 15, "#7cfc9a", "center", 700); else ubtn(cx, sy + 37, cw2 - 40, 30, "Comprar · 10000", "buy1", false);
        text("ITENS", 20, sy + 82, 14, "#8d97ab", "left", 700);
        text("Em breve", cx, sy + 118, 16, "#5d667a", "center", 600);
        if (shopMsg && performance.now() < shopMsg.e) text(shopMsg.s, cx, H - 92, 18, "#ffd166", "center", 700);
        ubtn(cx, H - 50, 160, 44, "← Voltar", "back", false);
      } else {
        g.fillStyle = "rgba(7,11,22,0.7)"; g.fillRect(0, 0, W, H);
        text("FASES", cx, H * 0.12, 28, "#ffd166", "center", 800);
        text("Novas fases em breve", cx, H * 0.12 + 24, 13, "#8d97ab", "center", 500);
        var lw = Math.min(150, (W - 50) / 2);
        for (var li = 0; li < 10; li++) {
          var lx = cx + (li % 2 ? 1 : -1) * (lw / 2 + 6), ly = H * 0.2 + Math.floor(li / 2) * 60, un = li < unlocked;
          if (un) uiBtns.push({ x: lx, y: ly, w: lw, h: 50, a: "lvl" + (li + 1) });
          g.fillStyle = un ? "rgba(255,209,102,0.15)" : "rgba(255,255,255,0.04)"; g.fillRect(lx - lw / 2, ly - 25, lw, 50);
          g.strokeStyle = un ? "#ffd166" : "rgba(255,255,255,0.2)"; g.lineWidth = 2; g.strokeRect(lx - lw / 2, ly - 25, lw, 50);
          text((un ? "" : "🔒 ") + "Fase " + (li + 1), lx, ly + 6, 16, un ? "#ffd166" : "#5d667a", "center", 700);
        }
        ubtn(cx, H - 50, 160, 44, "← Voltar", "back", false);
      }
    } else if (state === "win" || state === "over") {
      var cx2 = W / 2, w2 = state === "win", ready = performance.now() >= endAt, ty0 = H / 2 - 130, gs = "+" + runGold + " nesta partida", gw;
      uiBtns = [];
      g.fillStyle = "rgba(7,11,22,0.75)"; g.fillRect(0, 0, W, H);
      text(w2 ? "Fase " + level + " concluída!" : "Você morreu", cx2, ty0, Math.min(44, W / 9), w2 ? "#7cfc9a" : "#ff6b6b", "center", 700);
      text(w2 ? "Você derrotou o " + BOSS + "!" : "Você chegou à wave " + wave, cx2, ty0 + 38, 18, "#e8ecf4", "center", 500);
      text("Pontos: " + score + (newRec ? "  ·  Novo recorde!" : "  ·  Recorde: " + best), cx2, ty0 + 66, 16, newRec ? "#ffd166" : "#e8ecf4", "center", 600);
      g.font = "700 16px " + FONT; gw = g.measureText(gs).width + 26;
      coin(cx2 - gw / 2 + 9, ty0 + 94, 9); text(gs, cx2 - gw / 2 + 26, ty0 + 100, 16, "#ffd166", "left", 700);
      g.globalAlpha = ready ? 1 : 0.4;
      if (!w2) ubtn(cx2, H / 2 + 10, 250, 52, "↻ Tentar novamente", "retry", false, true);
      ubtn(cx2, H / 2 + (w2 ? 10 : 76), 250, 46, "🏠 Voltar ao lobby", "lobby", false, w2);
      g.globalAlpha = 1;
    }
  }

  // ---- conta / servidor ----
  var token = "", nick = "", prevSt = state, syncT = 0, mig = false;
  try { token = localStorage.getItem("tiro-token") || ""; mig = localStorage.getItem("tiro-migrated") === "1"; } catch (e) {}
  function api(path, body, cb) {
    var h = { "Content-Type": "application/json" }; if (token) h.Authorization = "Bearer " + token;
    fetch("/api/" + path, { method: body ? "POST" : "GET", headers: h, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().then(function (j) { cb(r.ok ? null : (j.error || "Erro"), j); }); })
      .catch(function () { cb("Servidor indisponível", null); });
  }
  function snap() { return { bag: bag, own1: own1, glv: glv, best: best, skin: skin }; }
  function applySave(v) { bag = v.bag | 0; own1 = !!v.own1; glv = Math.max(1, Math.min(3, (v.glv | 0) || 1)); best = v.best | 0; skin = owned(v.skin | 0) ? v.skin | 0 : 0; }
  function sync() { if (!token) return; clearTimeout(syncT); syncT = setTimeout(function () { api("save", snap(), function () {}); }, 800); }
  var ov = document.createElement("div");
  ov.style.cssText = "position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,8,18,.95);z-index:10;font-family:" + FONT;
  ov.innerHTML = '<style>#lg input,#lg button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;font:600 16px system-ui,sans-serif;border-radius:6px}#lg input{background:#0d1426;color:#e8ecf4;border:2px solid #3a4666}#lg button{cursor:pointer;border:2px solid #ffd166;background:transparent;color:#ffd166}#lg button.p{background:#ffd166;color:#10141c}</style>' +
    '<div id="lg" style="width:min(320px,86vw);text-align:center"><div style="font-size:28px;font-weight:800;color:#ffd166">SPACE TRAPP</div><div style="font-size:13px;color:#8d97ab;margin:6px 0 10px">Escolha seu nick único para jogar</div>' +
    '<input id="nk" maxlength="16" placeholder="Nick (3-16: letras, números, _)" autocomplete="username"><input id="pw" type="password" placeholder="Senha" autocomplete="current-password">' +
    '<div id="er" style="min-height:20px;color:#ff6b6b;font-size:13px;margin-top:8px"></div><button class="p" id="bi">Entrar</button><button id="br">Criar conta</button></div>';
  document.body.appendChild(ov);
  var nkI = ov.querySelector("#nk"), pwI = ov.querySelector("#pw"), erE = ov.querySelector("#er");
  function done(err, j) {
    if (err) { erE.textContent = err; return; }
    token = j.token; nick = j.nick; applySave(j.save); ov.style.display = "none"; pwI.value = ""; erE.textContent = "";
    try { localStorage.setItem("tiro-token", token); localStorage.setItem("tiro-migrated", "1"); } catch (e) {}
    mig = true;
  }
  function go(ep) { audio(); erE.textContent = ""; token = ""; var b = { nick: nkI.value.trim(), pass: pwI.value }; if (ep === "register" && !mig) b.save = snap(); api(ep, b, done); }
  ov.querySelector("#bi").onclick = function () { go("login"); };
  ov.querySelector("#br").onclick = function () { go("register"); };
  pwI.onkeydown = nkI.onkeydown = function (e) { if (e.key === "Enter") go("login"); };
  function logout() {
    api("logout", {}, function () {}); token = ""; nick = ""; bag = 0; own1 = false; glv = 1; best = 0; skin = 0;
    try { localStorage.removeItem("tiro-token"); } catch (e) {}
    ov.style.display = "flex";
  }
  if (token) api("me", null, function (err, j) { if (err) { token = ""; } else { nick = j.nick; applySave(j.save); ov.style.display = "none"; } });

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    update(dt);
    if (state !== prevSt) { prevSt = state; sync(); }
    bumpBest();
    draw();
    musicSync();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
